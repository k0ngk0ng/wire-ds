name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      windows_native_only:
        description: Verify only Windows native update installation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.platform }} · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_native_only && '[{"os":"windows-latest","platform":"win","arch":"x64"}]' || '[{"os":"macos-latest","platform":"mac","arch":"arm64"},{"os":"macos-latest","platform":"mac","arch":"x64"},{"os":"windows-latest","platform":"win","arch":"x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      electron_config_cache: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Desktop E2E
        if: (matrix.arch == 'arm64' || matrix.platform == 'win') && !inputs.windows_native_only
        run: npm run test:e2e
      - name: Report desktop E2E
        if: always() && (matrix.arch == 'arm64' || matrix.platform == 'win') && !inputs.windows_native_only
        run: node scripts/report-e2e.mjs artifacts/e2e-results.json
      - name: Package application
        run: npm run build && node scripts/package.mjs --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Verify macOS signature
        if: matrix.platform == 'mac'
        run: codesign --verify --deep --strict "release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/ChatDeepSeek.app"
      - name: Native update installation E2E
        if: matrix.arch == 'arm64' || matrix.platform == 'win'
        run: npm run test:install
      - name: Report native E2E
        if: always() && (matrix.arch == 'arm64' || matrix.platform == 'win')
        run: node scripts/report-e2e.mjs artifacts/install-results.json
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: chatdeepseek-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/SHA256SUMS-*.txt
      - name: Upload E2E evidence
        if: always() && (matrix.arch == 'arm64' || matrix.platform == 'win')
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            playwright-report/
            test-results/
            artifacts/e2e-results.json
            artifacts/install-report/
            artifacts/install-results.json

  release:
    name: Publish tagged installers
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chatdeepseek-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "ChatDeepSeek $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md
